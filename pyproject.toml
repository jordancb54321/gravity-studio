[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravity-studio"
version = "0.1.0"
description = "An interactive 2D gravity and capture-paint sandbox."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "ruff>=0.9,<1", "mypy>=1.15,<3"]

[project.scripts]
gravity-studio = "gravity_studio.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["gravity_studio"]
